services:
  server:
    image: ghcr.io/whhone/guix-pull-ready:latest
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    volumes:
      - data:/data
    command:
      - "--listen=:8080"
      - "--db-path=/data/guix-pull-ready.db"
      - "--systems=x86_64-linux,aarch64-linux"
      - "--poll-interval=10m"

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - server

volumes:
  data:
